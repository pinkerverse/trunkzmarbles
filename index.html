<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRUNKZ Marbles">
<meta name="description" content="Pick a TRUNKZ marble and watch it race through three black-and-white marble runs.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<title>TRUNKZ Marbles</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#151515}
body{font-family:ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{position:relative;width:100%;max-width:540px;height:100dvh;margin:0 auto;overflow:hidden;background:white}
#scene{width:100%;height:100%;position:absolute;inset:0;display:block;touch-action:manipulation}
#controls{position:absolute;bottom:max(5%,calc(env(safe-area-inset-bottom) + 8px));left:10%;width:80%;display:flex;gap:9px;align-items:center;justify-content:center;transition:opacity .18s;z-index:4}
button{background:white;border:3px solid #111;border-radius:99px;min-height:49px;padding:0 14px;color:#111;font:1000 13px ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;box-shadow:3px 4px 0 #161616;cursor:pointer;touch-action:manipulation}
button:active{box-shadow:1px 1px 0 #161616;transform:translate(2px,3px)}
#start{flex:1;max-width:210px;font-size:17px;letter-spacing:-.4px;background:#111;color:white}
#levelBtn{max-width:125px;min-width:105px}
body[data-mode="countdown"] #controls, body[data-mode="racing"] #controls{opacity:0;pointer-events:none}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:620px){main{height:min(96dvh,960px);margin:2dvh auto;border-radius:18px;box-shadow:0 18px 65px #0009}}
</style>
</head>
<body data-mode="ready">
<main aria-label="TRUNKZ Marbles: vertical racing game">
<canvas id="scene" aria-label="Six colorful TRUNKZ face marbles on a black-and-white marble run"></canvas>
<div id="controls"><button id="levelBtn" aria-label="Change marble run level">LEVEL 1</button><button id="start" aria-label="Start the marble race">START RACE</button></div>
<div id="status" role="status" aria-live="polite">Pick a marble, then start the race.</div>
</main>
<script src="./game.js"></script>
<script>if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
