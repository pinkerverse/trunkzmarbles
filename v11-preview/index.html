<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TRUNKZ Marbles">
<meta name="description" content="Seven TRUNKZ marbles. Three ever-changing marble runs. Pick your favorite and watch the race.">
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="../assets/icon.svg"><link rel="apple-touch-icon" href="../assets/icon.svg"><title>TRUNKZ Marbles</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#fff}
body{display:grid;place-items:center;font-family:ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{position:relative;width:min(100vw,56.25dvh);aspect-ratio:9/16;background:#fff;isolation:isolate}
#scene{width:100%;height:100%;position:absolute;inset:0;display:block;touch-action:manipulation}
#controls{position:absolute;top:77%;left:22%;width:50.5%;height:6.3%;z-index:3}
#start{height:100%;width:100%;border:0;border-radius:999px;background:#111;color:#fff;font:900 clamp(14px,3.8vw,23px) ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;letter-spacing:.02em;box-shadow:0 4px 0 #aaa;cursor:pointer;touch-action:manipulation;transition:transform .12s,box-shadow .12s}
#start:active{transform:translateY(3px);box-shadow:0 1px 0 #aaa}button:focus-visible{outline:3px dashed #111;outline-offset:7px}#start:disabled{background:#333;box-shadow:none;cursor:default}
body[data-mode="racing"] #controls{visibility:hidden}
#picks{position:absolute;inset:0;pointer-events:none}#picks button{position:absolute;top:26%;width:10.3%;height:7%;padding:0;border:0;background:transparent;border-radius:50%;pointer-events:auto;cursor:pointer;color:transparent}
body:not([data-mode="ready"]) #picks{visibility:hidden}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){#start{transition:none}}
</style></head>
<body data-mode="loading"><main aria-label="TRUNKZ Marbles: vertical marble race">
<canvas id="scene" role="img" aria-label="Seven original TRUNKZ marbles on a black and white marble run"></canvas>
<div id="picks" role="group" aria-label="Pick your marble"></div><div id="controls"><button id="start" disabled>LOADING MARBLES</button></div>
<div id="status" class="sr-only" role="status" aria-live="polite">Loading the original marble artwork.</div></main>
<script src="./physics.js?v=11"></script><script src="./game.js?v=11"></script>
</body></html>
